workflows:
  android-test-apk:
    name: UjianKita Test APK
    max_build_duration: 60
    environment:
      flutter: stable
    scripts:
      - name: Setup Android platform files
        script: |
          flutter create --platforms=android --org id.ujian_kita --project-name ujian_kita_sman18 .
          mkdir -p android/app/src/main/kotlin/id/ujian_kita/app
          cp android-template/MainActivity.kt android/app/src/main/kotlin/id/ujian_kita/app/MainActivity.kt
          cp android-template/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          mkdir -p android/gradle/wrapper
          cp android-template/gradle-wrapper.properties android/gradle/wrapper/gradle-wrapper.properties
          cp android-template/gradle.properties android/gradle.properties
      - name: Install dependencies
        script: flutter pub get
      - name: Build test APK
        script: flutter build apk --debug --android-skip-build-dependency-validation
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
