workflows:
  android-test-apk:
    name: UjianKita Test APK
    max_build_duration: 60
    environment:
      flutter: stable
    scripts:
      - name: Create Android platform files
        script: |
          rm -rf android
          flutter create --platforms=android --org id.ujian_kita --project-name ujian_kita_sman18 .
          cp android-template/MainActivity.kt android/app/src/main/kotlin/id/ujian_kita/ujian_kita_sman18/MainActivity.kt
          cp android-template/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          curl -L -A "Mozilla/5.0" --retry 5 --retry-delay 2 -o /tmp/gradle-9.3.1-bin.zip https://mirrors.cloud.tencent.com/gradle/gradle-9.3.1-bin.zip || true
          python3 -c "import os, re; p='android/gradle/wrapper/gradle-wrapper.properties'; s=open(p).read(); s=s.replace('services.gradle.org/distributions', 'mirrors.cloud.tencent.com/gradle').replace('-all.zip', '-bin.zip'); s=re.sub(r'distributionUrl=.*', 'distributionUrl=file\\:///tmp/gradle-9.3.1-bin.zip', s) if os.path.exists('/tmp/gradle-9.3.1-bin.zip') else s; open(p, 'w').write(s)"
          cat android/gradle/wrapper/gradle-wrapper.properties
      - name: Install dependencies
        script: flutter pub get
      - name: Build test APK
        script: flutter build apk --debug
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
