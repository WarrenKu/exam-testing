workflows:
  android-test-apk:
    name: UjianKita Test APK
    max_build_duration: 60
    environment:
      flutter: stable
    scripts:
      - name: Create Android platform files
        script: |
          rm -rf android
          flutter create --platforms=android --org id.ujian_kita --project-name ujian_kita_sman18 .
          cp android-template/MainActivity.kt android/app/src/main/kotlin/id/ujian_kita/ujian_kita_sman18/MainActivity.kt
          cp android-template/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
      - name: Install dependencies
        script: flutter pub get
      - name: Build test APK
        script: flutter build apk --debug
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
